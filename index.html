<!DOCTYPE html>
<html>
<head>
    <title>地理测试网站</title>
    <meta charset="UTF-8">
    <style>
        /*简单弹窗样式*/
        .mask{
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,0.5);
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .box{
            background:#fff;
            padding:30px;
            border-radius:8px;
        }
        .hide{
            display:none !important;
        }
        input{
            margin:8px 0;
            padding:6px;
            width:220px;
        }
        button{
            margin:5px;
            padding:6px 14px;
        }
    </style>
</head>
<body>
    <h2>地理测试网站</h2>
    <div>
        <span id="tip">请先登录</span>
        <button id="btnLogin">登录</button>
        <button id="btnRegister">注册</button>
    </div>
    <br>
    <!--原有链接，登录成功才可以跳转-->
    <a id="capital_Turkey" href="https://www.bch.com.cn/">你要去的地方</a>

    <!--登录弹窗-->
    <div id="loginMask" class="mask hide">
        <div class="box">
            <h3>登录</h3>
            <div>账号:<input id="loginUser" type="text"></div>
            <div>密码:<input id="loginPwd" type="password"></div>
            <div>
                <button id="loginSubmit">确认登录</button>
                <button id="loginClose">关闭</button>
            </div>
        </div>
    </div>

    <!--注册弹窗-->
    <div id="regMask" class="mask hide">
        <div class="box">
            <h3>注册</h3>
            <div>账号:<input id="regUser" type="text"></div>
            <div>密码:<input id="regPwd" type="password"></div>
            <div>
                <button id="regSubmit">确认注册</button>
                <button id="regClose">关闭</button>
            </div>
        </div>
    </div>

    <!--你的原有地理问答脚本，保持原有功能不受影响-->
    <script src="a.js"></script>

    <script>
        // =====================配置！改成你的FastAPI后端地址====================
        const BACKEND_URL = "https://xxx.pythonanywhere.com";

        // dom
        const tipDom = document.getElementById("tip");
        const btnLogin = document.getElementById("btnLogin");
        const btnRegister = document.getElementById("btnRegister");

        const loginMask = document.getElementById("loginMask");
        const loginUser = document.getElementById("loginUser");
        const loginPwd = document.getElementById("loginPwd");
        const loginSubmit = document.getElementById("loginSubmit");
        const loginClose = document.getElementById("loginClose");

        const regMask = document.getElementById("regMask");
        const regUser = document.getElementById("regUser");
        const regPwd = document.getElementById("regPwd");
        const regSubmit = document.getElementById("regSubmit");
        const regClose = document.getElementById("regClose");

        const linkGo = document.getElementById("capital_Turkey");

        let isLogin = false; //登录状态

        // 弹窗开关
        btnLogin.onclick = ()=> loginMask.classList.remove("hide");
        loginClose.onclick = ()=> loginMask.classList.add("hide");

        btnRegister.onclick = ()=> regMask.classList.remove("hide");
        regClose.onclick = ()=> regMask.classList.add("hide");

        // =========注册请求 POST /user/register =========
        regSubmit.onclick = async ()=>{
            const username = regUser.value.trim();
            const password = regPwd.value.trim();
            if(!username || !password){
                alert("账号密码不能为空");
                return;
            }
            const res = await fetch(`${BACKEND_URL}/user/register`,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body: JSON.stringify({username,password})
            });
            const data = await res.json();
            if(data.code === 200){
                alert("注册成功，请登录");
                regMask.classList.add("hide");
                regUser.value = "";
                regPwd.value = "";
            }else{
                alert(data.msg || "注册失败");
            }
        }

        // =========登录请求 POST /user/login =========
        loginSubmit.onclick = async ()=>{
            const username = loginUser.value.trim();
            const password = loginPwd.value.trim();
            if(!username || !password){
                alert("账号密码不能为空");
                return;
            }
            const res = await fetch(`${BACKEND_URL}/user/login`,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body: JSON.stringify({username,password})
            });
            const data = await res.json();
            if(data.code === 200){
                alert("登录成功！");
                isLogin = true;
                tipDom.innerText = "✅已登录，可以访问链接";
                loginMask.classList.add("hide");
                loginUser.value = "";
                loginPwd.value = "";
            }else{
                alert(data.msg || "账号密码错误");
            }
        }

        // =========拦截跳转：没有登录不让打开链接=========
        linkGo.addEventListener("click",function(e){
            if(!isLogin){
                e.preventDefault(); //阻止a标签跳转
                alert("⚠️请先登录！");
                loginMask.classList.remove("hide");
            }
        })
    </script>
</body>
</html>
