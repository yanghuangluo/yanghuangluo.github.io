<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f5f6fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 40px 48px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        h1 { margin: 0 0 8px; color: #333; }
        p { color: #888; margin-bottom: 28px; }
        .btn { display: block; width: 220px; padding: 12px; margin: 10px auto; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-primary { background: #4a90e2; color: #fff; }
        .btn-primary:hover { background: #3a7bc8; }
        .btn-outline { background: #fff; color: #4a90e2; border: 1px solid #4a90e2; }
        .btn-outline:hover { background: #f0f6ff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>欢迎访问</h1>
        <p>请选择登录或注册</p>
        <a class="btn btn-primary" href="login.html">登 录</a>
        <a class="btn btn-outline" href="signup.html">注 册</a>
    </div>
</body>
</html>
